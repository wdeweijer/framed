[package]
name = "ofposets"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]

[dependencies]
blake3 = "1.8"
petgraph = { version = "0.8.3", default-features = false }
rand = { version = "0.9", default-features = false, features = ["os_rng", "small_rng", "std"] }
rayon = "1"
rust-igraph = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events"] }

[workspace]
